name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"

  publish-pi:
    name: Publish for Raspberry Pi (linux-arm64)
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [EnviroPi.Sensor, EnviroPi.Display]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish ${{ matrix.project }}
        run: >
          dotnet publish ${{ matrix.project }}/${{ matrix.project }}.csproj
          -c Release --runtime linux-arm64 --self-contained
          -o publish/${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-linux-arm64
          path: publish/${{ matrix.project }}
